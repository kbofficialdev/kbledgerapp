version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb_khata_db
    restart: always
    environment:
      POSTGRES_USER: kbadmin
      POSTGRES_PASSWORD: kb_secure_db_password_2026
      POSTGRES_DB: kb_khata
    ports:
      - "5432:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbadmin -d kb_khata"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb_khata_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://kbadmin:kb_secure_db_password_2026@postgres:5432/kb_khata?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      PHONEPE_MERCHANT_ID: "PGTESTPAYUAT"
      PHONEPE_SALT_KEY: "099eb0cd-02cf-4e2a-8aca-3e6c6aff0399"
      PHONEPE_SALT_INDEX: "1"
      PHONEPE_ENV: "SANDBOX"
      PHONEPE_HOST_URL: "https://api-preprod.phonepe.com/apis/pg-sandbox"
      ADMIN_SECRET: "kb_khata_admin_jwt_secret_production"
      ADMIN_FALLBACK_PIN: "123456"

volumes:
  kb_postgres_data:
    driver: local

